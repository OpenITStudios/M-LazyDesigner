[package]
name = "lazydesigner"
version = "0.1.1"
description = "LazyDesigner desktop control plane"
authors = ["Halo Karya Media"]
license = "GPL-3.0-only"
repository = "https://github.com/MIVUBI-STD/M-LazyDesigner"
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.12.4", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-acceptance = []
