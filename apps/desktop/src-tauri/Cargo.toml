[package]
name = "lazydesigner"
default-run = "lazydesigner"
version = "0.1.1"
description = "LazyDesigner desktop control plane"
authors = ["Halo Karya Media"]
license = "GPL-3.0-only"
repository = "https://github.com/OpenITStudios/M-LazyDesigner"
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "=0.22.1"
png = "=0.17.16"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.12.4", features = [] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.54.0", features = ["net", "io-util", "time"], optional = true }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
], optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-acceptance = []
# User-opt-in only, not enabled by default. Read-only Windows local bridge.
live-read-bridge = ["dep:tokio", "dep:windows-sys"]
