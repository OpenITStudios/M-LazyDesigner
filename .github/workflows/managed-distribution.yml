name: Managed Distribution

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    if: startsWith(github.ref, 'refs/tags/lazydesigner-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run verify:release

  windows-package:
    needs: release-source
    if: always() && (needs.release-source.result == 'success' || needs.release-source.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Preserve canonical source line endings before checkout
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned baseline compiler
        id: bun-pin
        run: |
          $version = (Get-Content ../.bun-version -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected an exact pinned Bun version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun-pin.outputs.version }}/bun-windows-x64-baseline.zip
      - run: bun install --frozen-lockfile
      - name: Audit MCP dependency advisories
        run: bun run security:audit
      - name: Test managed file transactions and Codex TOML on Windows
        run: bun test tests/managed-install.test.ts
      - name: Build the native Runtime bundle
        run: bun run build
      - name: Compile, install twice, and initialize packaged Gateway
        run: bun run ../distribution/package.ts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lazydesigner-managed-windows-x64
          path: |
            mcp/dist/managed/lazydesigner-windows-x64.zip
            mcp/dist/managed/lazydesigner-package.json
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/lazydesigner-v')
    needs: [release-source, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lazydesigner-managed-windows-x64
      - name: Prepare release assets without publishing unaccepted native behavior
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^lazydesigner-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          flags=(--draft)
          if [[ "$TAG" == *-preview.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" lazydesigner-windows-x64.zip lazydesigner-package.json --repo "$REPOSITORY" --verify-tag "${flags[@]}" --title "LazyDesigner $TAG" --notes "Verified source and packaged Windows smoke tests. Native Blockbench/Codex acceptance and dependency closure must be reviewed before publishing. This workflow does not publish automatically."
