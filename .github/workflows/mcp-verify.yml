name: MCP Verify

on:
  push:
    branches:
      - Local
    paths:
      - 'mcp/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'GITHUB_RULES.md'
      - 'docs/**'
      - '.agents/**'
      - '.bun-version'
      - 'README.md'
      - 'CONTEXT.md'
  workflow_dispatch:
    inputs:
      verification:
        description: "Verification scope (full remains the default)"
        required: true
        type: choice
        default: full
        options:
          - full
          - texture

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scoped:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Verify focused repository contracts and types
        run: bun run verify:repository && bun run typecheck && bun run typecheck:gateway

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact SHA
        id: sha_proof
        working-directory: .
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          {
            echo "### MCP exact-SHA proof"
            echo
            printf -- '- exact_sha: `%s`\n' "$actual_sha"
            echo "- verification: manual full/texture; Local push runs scoped source contracts"
            echo "- live_local_tests: excluded"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        id: bun_setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        id: frozen_install
        run: bun install --frozen-lockfile

      # Full build verification is manual; focused push checks are in the separate scoped job.
      # A scoped PASS is NOT full source/build acceptance.
      - name: Run canonical full source verification
        if: ${{ github.event_name == 'push' || inputs.verification != 'texture' }}
        id: source_verify
        run: bun run verify:full

      - name: Run focused texture tests and typecheck
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification == 'texture' }}
        id: focused_verify
        run: bun run verify:texture:focused

      - name: Record exact-SHA build provenance
        if: ${{ github.event_name == 'push' || inputs.verification != 'texture' }}
        id: build_provenance
        run: bun run ./scripts/operations/verified-build-artifact.ts write-ci

      - name: Upload verified compatibility bundle
        if: ${{ github.event_name == 'push' || inputs.verification != 'texture' }}
        id: verified_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazydesigner-mcp-verified
          path: |
            mcp/dist/lazydesigner_mcp.js
            mcp/dist/lazydesigner-build-provenance.json
          if-no-files-found: error
          retention-days: 14

      # Evidence is emitted for failures too, without treating skipped checks as PASS.
      # The detailed diagnostics remain in the Actions job log (not an unredacted artifact).
      - name: Record ChatGPT-readable non-native verification
        if: always()
        working-directory: .
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          VERIFICATION_MODE: ${{ inputs.verification }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SERVER_URL: ${{ github.server_url }}
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_SHA_PROOF: ${{ steps.sha_proof.outcome }}
          STEP_BUN_SETUP: ${{ steps.bun_setup.outcome }}
          STEP_FROZEN_INSTALL: ${{ steps.frozen_install.outcome }}
          STEP_SOURCE_VERIFY: ${{ steps.source_verify.outcome }}
          STEP_FOCUSED_VERIFY: ${{ steps.focused_verify.outcome }}
          STEP_BUILD_PROVENANCE: ${{ steps.build_provenance.outcome }}
          STEP_VERIFIED_BUNDLE: ${{ steps.verified_bundle.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const env = process.env;
          const mode = env.VERIFICATION_MODE === 'texture' ? 'texture' : 'full';
          const steps = {
            checkout: env.STEP_CHECKOUT || 'unknown',
            exact_sha: env.STEP_SHA_PROOF || 'unknown',
            bun_setup: env.STEP_BUN_SETUP || 'unknown',
            frozen_install: env.STEP_FROZEN_INSTALL || 'unknown',
            verify_full: env.STEP_SOURCE_VERIFY || 'unknown',
            verify_texture: env.STEP_FOCUSED_VERIFY || 'unknown',
            build_provenance: env.STEP_BUILD_PROVENANCE || 'unknown',
            verified_bundle: env.STEP_VERIFIED_BUNDLE || 'unknown',
          };
          // Skipped build steps are valid in focused mode; skipped required
          // steps are always INCOMPLETE, never source acceptance.
          const requiredSteps = mode === 'texture'
            ? ['checkout', 'exact_sha', 'bun_setup', 'frozen_install', 'verify_texture']
            : ['checkout', 'exact_sha', 'bun_setup', 'frozen_install',
               'verify_full', 'build_provenance', 'verified_bundle'];
          const outcomes = requiredSteps.map(name => steps[name]);
          const status = outcomes.every(value => value === 'success')
            ? 'PASS'
            : outcomes.some(value => value === 'failure')
              ? 'FAIL'
              : 'INCOMPLETE';
          const report = {
            schema: 'lazydesigner-cloud-source-evidence-v1',
            scope: mode === 'texture'
              ? 'MCP_TEXTURE_SOURCE_NON_NATIVE' : 'MCP_SOURCE_NON_NATIVE',
            verification_mode: mode,
            required_steps: requiredSteps,
            verdict: status,
            source_sha: env.SOURCE_SHA,
            source_ref: env.SOURCE_REF,
            run_id: env.SOURCE_RUN_ID,
            run_attempt: env.SOURCE_RUN_ATTEMPT,
            run_url: env.SOURCE_SERVER_URL + '/' + env.SOURCE_REPOSITORY
              + '/actions/runs/' + env.SOURCE_RUN_ID,
            verifier: mode === 'texture'
              ? 'bun run verify:texture:focused' : 'bun run verify:full',
            steps,
            native_blockbench: 'NOT_EXECUTED',
          };
          const output = path.join(env.RUNNER_TEMP, 'lazydesigner-cloud-source-evidence.json');
          fs.writeFileSync(output, JSON.stringify(report, null, 2) + '\n');
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY,
            '\n### Non-native verification evidence\n\n'
            + '- Verdict: **' + status + '**\n'
            + '- Exact source: \x60' + report.source_sha + '\x60\n'
            + '- Selected verification outcome: \x60' + (mode === 'texture' ? steps.verify_texture : steps.verify_full) + '\x60\n'
            + '- Native Blockbench: **NOT EXECUTED**\n');
          NODE

      - name: Upload ChatGPT-readable non-native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazydesigner-cloud-source-evidence
          path: ${{ runner.temp }}/lazydesigner-cloud-source-evidence.json
          if-no-files-found: warn
          retention-days: 14
