name: MCP Conformance

on:
  push:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout LazyDesigner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install LazyDesigner dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Checkout pinned official MCP conformance suite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: modelcontextprotocol/conformance
          ref: 7169291ec0b68eb370fddcd9947313ab0d5e4156
          path: .mcp-conformance
          persist-credentials: false

      - name: Build pinned conformance CLI
        working-directory: .mcp-conformance
        run: npm ci && npm run build

      - name: Start source Runtime
        working-directory: mcp
        run: |
          bun run ./scripts/operations/serve-conformance-runtime.ts > /tmp/lazydesigner-conformance-runtime.log 2>&1 &
          echo $! > /tmp/lazydesigner-conformance-runtime.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3333/bb-mcp/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/lazydesigner-conformance-runtime.log
          exit 1

      - name: Run official MCP 2026-07-28 server requirements
        run: |
          node .mcp-conformance/dist/index.js server \
            --url http://127.0.0.1:3333/bb-mcp \
            --requirements 2026-07-28 \
            --output-dir conformance-results \
            --verbose

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazydesigner-mcp-conformance
          path: conformance-results/
          if-no-files-found: error
          retention-days: 14

      - name: Stop source Runtime
        if: always()
        run: |
          if [ -f /tmp/lazydesigner-conformance-runtime.pid ]; then
            kill "$(cat /tmp/lazydesigner-conformance-runtime.pid)" 2>/dev/null || true
          fi
          cat /tmp/lazydesigner-conformance-runtime.log 2>/dev/null || true
