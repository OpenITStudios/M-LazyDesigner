name: Dependency Security

on:
  push:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install exact lockfile
        run: bun install --frozen-lockfile

      - name: Audit dependency advisories
        run: bun run security:audit

  # Narrow read-only, opt-in candidate for the upstream RustSec fix.
  rust-upstream-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Local' && contains(github.event.head_commit.message, '[rust-upstream-review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current Local without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install exact Rust 1.98.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/Local'
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 cargo --version

      - name: Generate Tauri v2 upstream candidate with Cargo
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=apps/desktop/src-tauri/Cargo.toml
          rustup run 1.98.1 cargo update --manifest-path "$MANIFEST" -p tauri --precise 2.12.3
          rustup run 1.98.1 cargo update --manifest-path "$MANIFEST" -p tauri-build --precise 2.7.2
          rustup run 1.98.1 cargo update --manifest-path "$MANIFEST" -p tauri-utils --precise 2.10.1
          rustup run 1.98.1 cargo metadata --manifest-path "$MANIFEST" --locked --format-version 1 > /dev/null

      - name: Reject unrelated source edits and oversized dependency changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          manifest = "apps/desktop/src-tauri/Cargo.toml"
          lock = "apps/desktop/src-tauri/Cargo.lock"
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert changed == [lock], f"Expected only generated Cargo.lock to change: {changed}"
          old = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:" + lock], text=True))
          new = tomllib.loads(Path(lock).read_text())
          assert tomllib.loads(Path(manifest).read_text()) == tomllib.loads(
              subprocess.check_output(["git", "show", "HEAD:" + manifest], text=True)
          ), "Manifest must remain unchanged"
          old_versions = {p["name"]: p["version"] for p in old["package"]}
          new_versions = {p["name"]: p["version"] for p in new["package"]}
          for name, ver in {"tauri": "2.12.3", "tauri-build": "2.7.2",
                            "tauri-utils": "2.10.1", "urlpattern": "0.6.0"}.items():
              assert new_versions.get(name) == ver, f"Expected {name}@{ver}, got {new_versions.get(name)}"
          obsolete = {"zip", "serde_yaml", "ureq", "unsafe-libyaml", "unic-ucd-ident",
                      "unic-char-property", "unic-char-range", "unic-common", "unic-ucd-version"}
          assert obsolete.isdisjoint(new_versions), "Deprecated dependencies remain in the candidate"
          changed_packages = sorted((k, old_versions.get(k), v) for k, v in new_versions.items()
                                    if old_versions.get(k) != v)
          print("Changed packages:", len(changed_packages))
          for item in changed_packages:
              print(*item, sep=" -> ")
          assert len(changed_packages) <= 100, "Candidate scope exceeded the allowed dependency delta"
          PY

      - name: Record exact-SHA Cargo candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust-upstream-candidate
          git diff -- apps/desktop/src-tauri/Cargo.lock > rust-upstream-candidate/changes.patch
          sha256sum apps/desktop/src-tauri/Cargo.lock > rust-upstream-candidate/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("rust-upstream-candidate/source.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "generator": "Cargo 1.98.1 targeted Tauri v2 updates",
              "acceptance": "REVIEW_ONLY_NOT_COMMITTED"
          }, indent=2) + "\n")
          PY

      - name: Upload Tauri candidate without repository writeback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazydesigner-rust-upstream-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/Cargo.lock
            rust-upstream-candidate/source.json
            rust-upstream-candidate/SHA256SUMS.txt
            rust-upstream-candidate/changes.patch

  rustsec-audit:
    # Mandatory and separate from the opt-in Cargo candidate generator.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned Local source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify source and pin Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 rustc --version

      - name: Install pinned cargo-audit scanner
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/rustsec-tools"
          "$RUNNER_TEMP/rustsec-tools/bin/cargo-audit" --version

      - name: Classify RustSec dependencies for the Windows Cargo target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/windows-cargo-metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"], "windows-cargo-metadata.json").read_text())
          active_ids = {node["id"] for node in data["resolve"]["nodes"]}
          active_names = {pkg["name"] for pkg in data["packages"] if pkg["id"] in active_ids}
          targets = ["proc-macro-error", "unic-char-property", "unic-char-range", "unic-common",
                     "unic-ucd-ident", "unic-ucd-version", "zbus_names", "zvariant",
                     "zvariant_derive", "glib"]
          lines = ["### Windows x86_64-pc-windows-msvc Cargo target graph", "",
                   "| RustSec flagged crate | Resolved for Windows |",
                   "| --- | --- |"]
          for crate in targets:
              lines.append(f"| {crate} | {'YES' if crate in active_names else 'NO'} |")
          lines.append("")
          lines.append("Resolved target dependency is not proof of unsafe API reachability.")
          report = "\n".join(lines) + "\n"
          print(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write(report)
          PY
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock

      - name: Audit complete Cargo.lock with a fresh RustSec database
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rustsec-tools/bin/cargo-audit" audit --file apps/desktop/src-tauri/Cargo.lock --deny unmaintained --deny unsound --deny yanked

      - name: Prove advisory audit did not edit the Cargo source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
