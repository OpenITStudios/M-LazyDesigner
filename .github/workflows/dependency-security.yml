name: Dependency Security

on:
  push:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install exact lockfile
        run: bun install --frozen-lockfile

      - name: Audit dependency advisories
        run: bun run security:audit

  # Explicit opt-in candidate only. No new event trigger, writes or trusted release path.
  rust-lock-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Local' && contains(github.event.head_commit.message, '[rust-lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Local source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Pin repository source and Rust compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/Local'
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 rustc --version
          rustup run 1.98.1 cargo --version

      - name: Generate narrow Rust dependency removal through Cargo
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo remove --manifest-path apps/desktop/src-tauri/Cargo.toml zip serde_yaml ureq
          rustup run 1.98.1 cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
          rustup run 1.98.1 cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null

      - name: Reject unrelated changes or unresolved removed Rust crates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          manifest = "apps/desktop/src-tauri/Cargo.toml"
          lock = "apps/desktop/src-tauri/Cargo.lock"
          removed = {"zip", "serde_yaml", "ureq"}
          old_manifest = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:" + manifest], text=True))
          new_manifest = tomllib.loads(Path(manifest).read_text())
          assert removed <= set(old_manifest["dependencies"]), "Expected direct Rust dependencies changed unexpectedly"
          old_manifest["dependencies"] = {k: v for k, v in old_manifest["dependencies"].items() if k not in removed}
          assert new_manifest == old_manifest, "Manifest changed beyond three approved removals"
          old_lock = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:" + lock], text=True))
          new_lock = tomllib.loads(Path(lock).read_text())
          old_packages = {(p["name"], p["version"]) for p in old_lock["package"]}
          new_packages = {(p["name"], p["version"]) for p in new_lock["package"]}
          assert not new_packages - old_packages, "Cargo refreshed or introduced unrelated package versions"
          names = {p["name"] for p in new_lock["package"]}
          assert not (removed | {"unsafe-libyaml"}) & names, "Removed dependencies persist in Cargo.lock"
          assert {"unsafe-libyaml", *removed} <= {p["name"] for p in old_lock["package"]}
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert sorted(changed) == sorted([manifest, lock]), "Cargo modified unexpected source paths"
          print("Cargo-generated manifest and lockfile: only approved removals; no new versions")
          print("Pruned package versions:", len(old_packages - new_packages))
          PY

      - name: Record exact-SHA provenance and candidate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust-candidate
          git diff -- apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock > rust-candidate/changes.patch
          sha256sum apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock > rust-candidate/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          info = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "cargo_toolchain": "1.98.1",
              "generator": "cargo remove zip serde_yaml ureq; cargo metadata --locked",
              "mode": "READ_ONLY_CANDIDATE_NOT_COMMITTED",
              "removed_direct_dependencies": ["zip", "serde_yaml", "ureq"],
              "cargo_version": subprocess.check_output(["rustup", "run", "1.98.1", "cargo", "--version"], text=True).strip(),
          }
          Path("rust-candidate/source.json").write_text(json.dumps(info, indent=2) + "\n")
          PY

      - name: Upload reviewable Rust lockfile candidate (not accepted source)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazydesigner-rust-lock-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/Cargo.toml
            apps/desktop/src-tauri/Cargo.lock
            rust-candidate/source.json
            rust-candidate/SHA256SUMS.txt
            rust-candidate/changes.patch

  rustsec-audit:
    # Mandatory and separate from the opt-in Cargo candidate generator.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned Local source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify source and pin Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 rustc --version

      - name: Install pinned cargo-audit scanner
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/rustsec-tools"
          "$RUNNER_TEMP/rustsec-tools/bin/cargo-audit" --version

      - name: Audit complete Cargo.lock with a fresh RustSec database
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rustsec-tools/bin/cargo-audit" audit --file apps/desktop/src-tauri/Cargo.lock --deny unmaintained --deny unsound --deny yanked

      - name: Prove advisory audit did not edit the Cargo source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
