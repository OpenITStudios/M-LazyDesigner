name: Dependency Security

on:
  push:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install exact lockfile
        run: bun install --frozen-lockfile

      - name: Audit dependency advisories
        run: bun run security:audit

  # Narrow read-only, opt-in candidate for the upstream RustSec fix.
  rust-upstream-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Local' && contains(github.event.head_commit.message, '[rust-upstream-review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current Local without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install exact Rust 1.98.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/Local'
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 cargo --version

      - name: Setup Node 24 for aligned npm candidate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Generate Tauri v2 upstream candidate with Cargo
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=apps/desktop/src-tauri/Cargo.toml
          rustup run 1.98.1 cargo update --manifest-path "$MANIFEST" -p tauri --precise 2.12.3
          rustup run 1.98.1 cargo metadata --manifest-path "$MANIFEST" --locked --format-version 1 > /dev/null

      - name: Generate npm API/CLI 2.12.3 candidate with npm
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund @tauri-apps/api@2.12.3
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund --save-dev @tauri-apps/cli@2.12.3

      - name: Reject unrelated source edits and oversized dependency changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          manifest = "apps/desktop/src-tauri/Cargo.toml"
          lock = "apps/desktop/src-tauri/Cargo.lock"
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          npm_manifest, npm_lock = "apps/desktop/package.json", "apps/desktop/package-lock.json"
          assert sorted(changed) == sorted([lock, npm_manifest, npm_lock]), f"Out-of-scope file changes: {changed}"
          old_npm = json.loads(subprocess.check_output(["git", "show", "HEAD:" + npm_manifest], text=True))
          new_npm = json.loads(Path(npm_manifest).read_text())
          old_npm["dependencies"]["@tauri-apps/api"] = "2.12.3"
          old_npm["devDependencies"]["@tauri-apps/cli"] = "2.12.3"
          assert old_npm == new_npm, "Only two npm Tauri requirements may change"
          npm_data = json.loads(Path(npm_lock).read_text())
          assert npm_data["packages"][""]["dependencies"]["@tauri-apps/api"] == "2.12.3"
          assert npm_data["packages"][""]["devDependencies"]["@tauri-apps/cli"] == "2.12.3"
          for package in ["@tauri-apps/api", "@tauri-apps/cli"]:
              assert npm_data["packages"]["node_modules/" + package]["version"] == "2.12.3"
          previous_npm = json.loads(subprocess.check_output(["git", "show", "HEAD:" + npm_lock], text=True))
          before = {k:v.get("version") for k,v in previous_npm["packages"].items()}
          after = {k:v.get("version") for k,v in npm_data["packages"].items()}
          delta = [k for k in set(before) | set(after) if before.get(k) != after.get(k)]
          print("Changed npm package entries:", len(delta), sorted(delta))
          assert len(delta) <= 35, "Npm candidate exceeds transitive change budget"
          old = tomllib.loads(subprocess.check_output(["git", "show", "HEAD:" + lock], text=True))
          new = tomllib.loads(Path(lock).read_text())
          assert tomllib.loads(Path(manifest).read_text()) == tomllib.loads(
              subprocess.check_output(["git", "show", "HEAD:" + manifest], text=True)
          ), "Manifest must remain unchanged"
          old_versions = {p["name"]: p["version"] for p in old["package"]}
          new_versions = {p["name"]: p["version"] for p in new["package"]}
          for name, ver in {"tauri": "2.12.3", "tauri-build": "2.7.3",
                            "tauri-utils": "2.10.2", "urlpattern": "0.6.0"}.items():
              assert new_versions.get(name) == ver, f"Expected {name}@{ver}, got {new_versions.get(name)}"
          obsolete = {"zip", "serde_yaml", "ureq", "unsafe-libyaml", "unic-ucd-ident",
                      "unic-char-property", "unic-char-range", "unic-common", "unic-ucd-version"}
          assert obsolete.isdisjoint(new_versions), "Deprecated dependencies remain in the candidate"
          changed_packages = sorted((k, old_versions.get(k), v) for k, v in new_versions.items()
                                    if old_versions.get(k) != v)
          print("Changed packages:", len(changed_packages))
          for item in changed_packages:
              print(*item, sep=" -> ")
          assert len(changed_packages) <= 100, "Candidate scope exceeded the allowed dependency delta"
          PY

      - name: Record exact-SHA Cargo candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust-upstream-candidate
          git diff -- apps/desktop/src-tauri/Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json > rust-upstream-candidate/changes.patch
          sha256sum apps/desktop/src-tauri/Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json > rust-upstream-candidate/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("rust-upstream-candidate/source.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "generator": "Cargo Tauri 2.12.3 and npm API/CLI 2.12.3 on Node24",
              "acceptance": "REVIEW_ONLY_NOT_COMMITTED"
          }, indent=2) + "\n")
          PY

      - name: Audit generated Rust lockfile with fresh RustSec database (candidate only)
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/candidate-rustsec"
          set +e
          "$RUNNER_TEMP/candidate-rustsec/bin/cargo-audit" audit --json --file apps/desktop/src-tauri/Cargo.lock --deny unmaintained --deny unsound --deny yanked > rust-upstream-candidate/rustsec.json 2> rust-upstream-candidate/rustsec-stderr.txt
          audit_status=$?
          set -e
          AUDIT_STATUS="$audit_status" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("rust-upstream-candidate/rustsec.json")
          data = json.loads(report_path.read_text())
          vulnerabilities = data.get("vulnerabilities")
          if not isinstance(vulnerabilities, dict) or not isinstance(vulnerabilities.get("count"), int):
              raise SystemExit("RustSec JSON response did not contain authoritative vulnerability count")
          vulnerability_count = vulnerabilities["count"]
          warnings = data.get("warnings")
          if not isinstance(warnings, dict):
              raise SystemExit("RustSec JSON response lacked categorized informational warnings")
          warning_count = sum(len(rows) for rows in warnings.values() if isinstance(rows, list))
          audit_status = int(os.environ["AUDIT_STATUS"])
          summary = (f"### Review-only generated Cargo.lock RustSec audit\n\n"
                     f"- Classified vulnerabilities: **{vulnerability_count}**\n"
                     f"- Informational/yanked warnings: **{warning_count}**\n"
                     f"- Strict audit exit code: **{audit_status}**\n"
                     f"- No ignore IDs or category suppressions; committed-source RustSec gate is independent.\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write(summary)
          if audit_status not in (0, 1):
              raise SystemExit("Candidate RustSec scan had an operational/database error")
          if vulnerability_count:
              raise SystemExit("Generated candidate contains vulnerability advisories; cannot be accepted")
          if audit_status == 1 and warning_count == 0:
              raise SystemExit("RustSec rejected candidate for an unclassified reason")
          print(f"Candidate RustSec: {vulnerability_count} vulnerabilities, {warning_count} informational warnings; source acceptance still pending")
          PY

      - name: Upload Tauri candidate without repository writeback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazydesigner-rust-upstream-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/Cargo.lock
            apps/desktop/package.json
            apps/desktop/package-lock.json
            rust-upstream-candidate/source.json
            rust-upstream-candidate/SHA256SUMS.txt
            rust-upstream-candidate/changes.patch
            rust-upstream-candidate/rustsec.json
            rust-upstream-candidate/rustsec-stderr.txt

  rust-upstream-windows:
    # Candidate-only Windows check: exact same-run artifact, no build upload or source writeback.
    needs: rust-upstream-candidate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version

      - name: Download same-run Cargo candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lazydesigner-rust-upstream-candidate
          path: ${{ runner.temp }}/rust-upstream-windows

      - name: Verify same-run generated candidate file identities
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'rust-upstream-windows'
          $metadata = Get-Content (Join-Path $root 'rust-upstream-candidate/source.json') -Raw | ConvertFrom-Json
          if ($metadata.repository -ne $env:GITHUB_REPOSITORY -or $metadata.source_ref -ne 'refs/heads/Local' -or
              $metadata.source_sha -ne $env:GITHUB_SHA -or $metadata.run_id -ne $env:GITHUB_RUN_ID -or
              $metadata.acceptance -ne 'REVIEW_ONLY_NOT_COMMITTED') {
            throw 'Candidate source identity mismatch.'
          }
          $paths = @('apps/desktop/src-tauri/Cargo.lock','apps/desktop/package.json','apps/desktop/package-lock.json')
          $checksums = @(Get-Content (Join-Path $root 'rust-upstream-candidate/SHA256SUMS.txt'))
          if ($checksums.Count -ne 3) { throw 'Expected three checksums.' }
          foreach ($path in $paths) {
            $lines = @($checksums | Where-Object { $_ -match ('^[0-9a-f]{64}  ' + [regex]::Escape($path) + '$') })
            if ($lines.Count -ne 1) { throw "Missing checksum for $path" }
            $file = Join-Path $root $path
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lines[0].Substring(0,64)) {
              throw "Candidate checksum mismatch: $path"
            }
            Copy-Item -LiteralPath $file -Destination $path -Force
          }
          git diff --check
          $changed = @(git diff --name-only)
          $deltas = @(Compare-Object -ReferenceObject ($paths | Sort-Object) -DifferenceObject ($changed | Sort-Object))
          if ($changed.Count -ne 3 -or $deltas.Count -gt 0) { throw 'Out-of-scope candidate source changes.' }

      - name: Validate resolved Windows candidate Cargo graph
        shell: pwsh
        run: |
          $manifest = 'apps/desktop/src-tauri/Cargo.toml'
          $result = (& cargo metadata --locked --format-version 1 --manifest-path $manifest --filter-platform x86_64-pc-windows-msvc | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Windows Cargo metadata failed.' }
          $metadata = $result | ConvertFrom-Json
          $resolved = @{}
          foreach ($node in $metadata.resolve.nodes) { $resolved[$node.id] = $true }
          $packages = @{}
          foreach ($package in $metadata.packages) {
            if ($resolved.ContainsKey($package.id)) { $packages[$package.name] = $package.version }
          }
          foreach ($crate in @('unic-char-property','unic-char-range','unic-common','unic-ucd-ident','unic-ucd-version')) {
            if ($packages.ContainsKey($crate)) { throw "Deprecated crate remains in Windows candidate: $crate" }
          }
          foreach ($item in @(@('tauri','2.12.3'),@('tauri-utils','2.10.2'),@('urlpattern','0.6.0'))) {
            if ($packages[$item[0]] -ne $item[1]) { throw "Windows Cargo candidate version mismatch: $($item[0])" }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Cargo --locked Windows-target metadata confirms Tauri 2.12.3, tauri-utils 2.10.2, urlpattern 0.6.0 and no unic-* advisory packages.'

      - name: Validate matching Tauri npm API and CLI versions
        shell: pwsh
        run: |
          $pkg = Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          $lock = Get-Content 'apps/desktop/package-lock.json' -Raw | ConvertFrom-Json -AsHashtable
          if ($pkg.dependencies.'@tauri-apps/api' -ne '2.12.3' -or $pkg.devDependencies.'@tauri-apps/cli' -ne '2.12.3') {
            throw 'Tauri npm candidate manifest mismatch.'
          }
          foreach ($name in @('@tauri-apps/api', '@tauri-apps/cli')) {
            $entry = $lock['packages']['node_modules/' + $name]
            if ($entry['version'] -ne '2.12.3') { throw "Tauri npm candidate lock mismatch: $name" }
          }

      - name: Install Desktop dependencies with frozen npm lock
        working-directory: apps/desktop
        run: npm ci

      - name: Audit aligned npm candidate lock (high-severity)
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Check candidate Windows frontend and locked Rust tests
        working-directory: apps/desktop
        run: npm run verify:source

      - name: Build candidate-only NSIS shell with aligned Tauri CLI
        working-directory: apps/desktop
        run: npm run build:app:shell

      - name: Silent-install candidate shell only in temporary GitHub runner
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one candidate NSIS installer, got $($installers.Count)." }
          $target = Join-Path $env:RUNNER_TEMP 'lazydesigner-tauri-candidate-shell-smoke'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Candidate NSIS silent-install exit code: $($process.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $target 'LazyDesigner.exe') -PathType Leaf)) {
            throw 'Candidate NSIS shell executable missing after silent-install.'
          }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Review-only candidate NSIS shell built and silent-installed in disposable Windows runner (SHA-256 $hash); excludes managed-resource bootstrap, publish, signed release, Windows downgrade and native Blockbench acceptance."

      - name: Record candidate-only proof boundary
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Candidate-only Tauri Rust/npm Windows source and NSIS shell checks passed. No Cargo/npm source updates accepted, no local PC installation or release.'

  rustsec-audit:
    # Mandatory and separate from the opt-in Cargo candidate generator.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned Local source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify source and pin Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 rustc --version

      - name: Install pinned cargo-audit scanner
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/rustsec-tools"
          "$RUNNER_TEMP/rustsec-tools/bin/cargo-audit" --version

      - name: Classify RustSec dependencies for the Windows Cargo target
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/windows-cargo-metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"], "windows-cargo-metadata.json").read_text())
          active_ids = {node["id"] for node in data["resolve"]["nodes"]}
          active_names = {pkg["name"] for pkg in data["packages"] if pkg["id"] in active_ids}
          targets = ["proc-macro-error", "unic-char-property", "unic-char-range", "unic-common",
                     "unic-ucd-ident", "unic-ucd-version", "zbus_names", "zvariant",
                     "zvariant_derive", "glib"]
          lines = ["### Windows x86_64-pc-windows-msvc Cargo target graph", "",
                   "| RustSec flagged crate | Resolved for Windows |",
                   "| --- | --- |"]
          for crate in targets:
              lines.append(f"| {crate} | {'YES' if crate in active_names else 'NO'} |")
          lines.append("")
          lines.append("Resolved target dependency is not proof of unsafe API reachability.")
          report = "\n".join(lines) + "\n"
          print(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write(report)
          PY
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock

      - name: Audit complete Cargo.lock with a fresh RustSec database
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rustsec-tools/bin/cargo-audit" audit --file apps/desktop/src-tauri/Cargo.lock --deny unmaintained --deny unsound --deny yanked

      - name: Prove advisory audit did not edit the Cargo source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
