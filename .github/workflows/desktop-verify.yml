name: Desktop Verify

on:
  push:
    branches:
      - Local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Parse Desktop PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -LiteralPath ./scripts -Filter '*.ps1' -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell syntax error in $($script.Name): $messages"
            }
          }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version

      - name: Resolve pinned baseline Bun
        id: bun-pin
        shell: pwsh
        run: |
          $version = (Get-Content ../../.bun-version -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected an exact pinned Bun version.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup baseline Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun-pin.outputs.version }}/bun-windows-x64-baseline.zip

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit Desktop npm dependencies
        run: npm audit --audit-level=high

      - name: Verify Desktop source
        run: npm run verify:source

      - name: Build Windows installer smoke
        run: npm run build:app

      - name: Silent-install Desktop and smoke bundled bootstrap
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }

          $installRoot = Join-Path $env:RUNNER_TEMP 'lazydesigner-desktop-smoke'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with exit code $($process.ExitCode)." }

          $desktop = Join-Path $installRoot 'LazyDesigner.exe'
          $manager = Join-Path $installRoot 'resources\managed\lazydesigner.exe'
          $package = Split-Path -Parent $manager
          $manifest = Join-Path $package 'lazydesigner-package.json'
          foreach ($path in @($desktop, $manager, $manifest)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed Desktop payload is missing: $path" }
          }

          $packageManifest = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($packageManifest.source_sha -ne $env:GITHUB_SHA) {
            throw "Bundled managed source SHA $($packageManifest.source_sha) does not match Desktop source SHA $env:GITHUB_SHA."
          }

          # Desktop owns exactly one workstation process. A second launch must
          # exit while the first process remains alive.
          $firstDesktop = Start-Process -FilePath $desktop -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($firstDesktop.HasExited) {
              throw "Primary Desktop exited unexpectedly with code $($firstDesktop.ExitCode)."
            }

            $secondDesktop = Start-Process -FilePath $desktop -PassThru
            if (!$secondDesktop.WaitForExit(10000)) {
              Stop-Process -Id $secondDesktop.Id -Force -ErrorAction SilentlyContinue
              throw 'Second Desktop launch did not exit after detecting the existing instance.'
            }
            if ($secondDesktop.ExitCode -ne 0) {
              throw "Second Desktop launch exited with code $($secondDesktop.ExitCode)."
            }
            if ($firstDesktop.HasExited) {
              throw 'Primary Desktop was terminated by the second launch.'
            }

            $desktopPath = [IO.Path]::GetFullPath($desktop)
            $ownedProcesses = @(
              Get-CimInstance Win32_Process -Filter "Name='LazyDesigner.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ExecutablePath -and
                  ([IO.Path]::GetFullPath([string]$_.ExecutablePath) -eq $desktopPath)
                }
            )
            if ($ownedProcesses.Count -ne 1) {
              throw "Expected exactly one installed LazyDesigner process after second launch, found $($ownedProcesses.Count)."
            }
          } finally {
            if ($firstDesktop -and !$firstDesktop.HasExited) {
              Stop-Process -Id $firstDesktop.Id -Force -ErrorAction SilentlyContinue
              $firstDesktop.WaitForExit(5000) | Out-Null
            }
          }

          $selfTest = (& $manager self-test | Out-String | ConvertFrom-Json)
          if ($selfTest.status -ne 'PASS') { throw 'Bundled managed executable self-test failed after NSIS installation.' }

          $managedRoot = Join-Path $env:RUNNER_TEMP 'lazydesigner-managed-smoke'
          $workspace = Join-Path $env:RUNNER_TEMP 'lazydesigner-workspace-smoke'
          $plugin = Join-Path $env:RUNNER_TEMP 'Blockbench\plugins\lazydesigner_mcp.js'
          $config = Join-Path $env:RUNNER_TEMP 'Codex\config.toml'
          $tls = Join-Path $env:RUNNER_TEMP 'LazyDesigner\tls'
          foreach ($path in @($managedRoot, $workspace, (Split-Path -Parent $plugin), (Split-Path -Parent $config), $tls)) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }

          $env:LAZYDESIGNER_TLS_DIR = $tls
          $installed = (& $manager install --root $managedRoot --workspace $workspace --plugin-path $plugin --config $config --package $package | Out-String | ConvertFrom-Json)
          if ($installed.status -ne 'INSTALLED') { throw 'Bundled managed first-install smoke failed.' }
          if (!(Test-Path -LiteralPath $plugin -PathType Leaf)) { throw 'Managed Blockbench plugin was not installed to the explicit plugin path.' }
          foreach ($name in @('cert.pem', 'key.pem')) {
            if (!(Test-Path -LiteralPath (Join-Path $tls $name) -PathType Leaf)) { throw "Runtime TLS $name was not provisioned by first install." }
          }

          $state = (& $manager status --root $managedRoot | Out-String | ConvertFrom-Json)
          if ($state.installed.source_sha -ne $env:GITHUB_SHA) {
            throw "Installed managed source SHA $($state.installed.source_sha) does not match Desktop source SHA $env:GITHUB_SHA."
          }
          if ($state.tls_ready -ne $true -or $state.tls_error) {
            throw 'Managed status did not report ready Runtime TLS after first install.'
          }

          # Runtime TLS maintenance is explicit and must refuse an active Gateway lease.
          $leases = Join-Path $managedRoot 'leases'
          New-Item -ItemType Directory -Path $leases -Force | Out-Null
          $lease = Join-Path $leases "$PID.json"
          '{"source_sha":"smoke"}' | Set-Content -Encoding ascii $lease
          $busyOutput = (& $manager setup-tls --root $managedRoot 2>&1 | Out-String)
          $busyExit = $LASTEXITCODE
          Remove-Item -LiteralPath $lease -Force
          if ($busyExit -eq 0) { throw 'Runtime TLS setup ignored an active Gateway lease.' }
          if ($busyOutput -notmatch 'Close Blockbench and active Codex MCP sessions before Runtime TLS setup') {
            throw "Runtime TLS busy refusal was not explicit: $busyOutput"
          }

          # A complete but invalid pair must be recoverable through the explicit idle renewal path.
          'invalid certificate' | Set-Content -Encoding ascii (Join-Path $tls 'cert.pem')
          'invalid private key' | Set-Content -Encoding ascii (Join-Path $tls 'key.pem')
          $renewed = (& $manager setup-tls --root $managedRoot | Out-String | ConvertFrom-Json)
          if ($renewed.status -ne 'TLS_READY' -or $renewed.ready -ne $true) {
            throw 'Explicit Runtime TLS renewal did not return TLS_READY.'
          }
          $renewedState = (& $manager status --root $managedRoot | Out-String | ConvertFrom-Json)
          if ($renewedState.tls_ready -ne $true -or $renewedState.tls_error) {
            throw 'Managed status did not recover after explicit Runtime TLS renewal.'
          }

      - name: Write Desktop installer checksum
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $hash = (Get-FileHash -Algorithm SHA256 $installers[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -Encoding ascii (Join-Path $bundle 'SHA256SUMS.txt')
          $version = (Get-Content -LiteralPath (Join-Path $PWD 'package.json') -Raw | ConvertFrom-Json).version
          $provenance = [ordered]@{
            schema = 1
            source_sha = $env:GITHUB_SHA
            desktop_version = $version
            installer = $installers[0].Name
            installer_sha256 = $hash
            managed_source_sha = $env:GITHUB_SHA
          }
          $provenance | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $bundle 'desktop-build-provenance.json')

      - name: Upload Desktop installer smoke artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lazydesigner-desktop-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/desktop-build-provenance.json
          if-no-files-found: error
          retention-days: 14
